    <body>
        <div id="app"></div>
        <script src="/Stapxs-QQ-Lite-2.0/bcui/js/main.js"></script>
        <!-- 2026-10-28 自加：Stapxs 首次启动有个多步「欢迎/协议/功能」向导（.wel-next 几个「继续」），
         自己人用的控制台不需要每次点过去，这里自动点掉。 -->
    <script>
    (function () {
      // Stapxs 的欢迎向导是在「连上之后」才弹的（不是 onload 那一刻），
      // 所以窗口要给够：一直盯着，看到就点，直到点完或 5 分钟。
      var clicks = 0, done = false;
      function clickWel() {
        var btn = document.querySelector('.wel-next');
        if (!btn) return false;
        btn.click();
        clicks++;
        if (clicks > 14) done = true;
        return true;
      }
      function closeOverlay() {
        // 只在这个弹窗自己里面找「关闭」，别误伤聊天区的文字
        var root = document.querySelector('[class*="wel"], [class*="pop-box"], [class*="ss-pop"]');
        if (!root) return;
        var bs = root.querySelectorAll('button, .ss-button');
        for (var i = 0; i < bs.length; i++) {
          var t = (bs[i].textContent || '').trim();
          if (t === '关闭' || t === '我知道了') { bs[i].click(); done = true; return; }
        }
      }
      var timer = setInterval(function () {
        if (done) { clearInterval(timer); return; }
        clickWel();
        closeOverlay();
      }, 800);
      setTimeout(function () { clearInterval(timer); }, 300000);
    })();
    </script>    </script></body>
